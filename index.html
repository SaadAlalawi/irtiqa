<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ارتقاء</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a24;--mute:#6b7770;--green:#1f6b4f;--green2:#e3f1ea;--line:#e4e0d4;--amber:#b7791f;--amber2:#fbf1dc;--red:#a8382f;--red2:#fbe7e4;--dot:#ddd9cc}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2621;--ink:#e9efe9;--mute:#9aa8a0;--green:#5cc49a;--green2:#1f3a2f;--line:#2c3832;--amber:#e3b45a;--amber2:#3a3118;--red:#ef8a80;--red2:#3d1f1c;--dot:#33403a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 70px}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:8px 4px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:15px;color:var(--mute);margin:14px 0 6px}
label:first-child{margin-top:0}
select,input,textarea{width:100%;font:inherit;padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.seg,.seg2{display:flex;gap:8px}
.seg button,.seg2 button{flex:1;min-height:48px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;font-size:16px;cursor:pointer}
.seg button.on,.seg2 button.on{border-color:var(--green);background:var(--green2);color:var(--green);font-weight:700}
.act{display:flex;gap:8px;margin-top:12px}
.act>*{flex:1;min-height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;font:inherit;font-size:16px;font-weight:700;border:0;cursor:pointer}
.act .c{background:var(--green);color:#fff}.act .g{background:var(--green2);color:var(--green)}
.tabs.sub{margin-bottom:12px}
.note{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15px}
.note.good{background:var(--green2)}.note.good b{color:var(--green)}
.note.warn{background:var(--red2)}.note.warn b{color:var(--red)}
select.ntsel[data-v=good]{border-color:var(--green);background:var(--green2)}
select.ntsel[data-v=warn]{border-color:var(--red);background:var(--red2)}
.btn{width:100%;margin-top:18px;min-height:56px;border:0;border-radius:14px;background:var(--green);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--green2);color:var(--green);margin-top:0;min-height:46px;font-size:15px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.done{background:var(--green2);color:var(--green);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.d{color:var(--mute);font-size:14px}
.hist{padding:10px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.nav button:disabled{opacity:.3}
.nav .t{text-align:center;font-weight:700}
.bar{height:8px;background:var(--dot);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.st{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.no{width:34px;height:34px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}
.st.miss .no{background:var(--dot);color:var(--mute)}
.st .nm{font-weight:700}
.st .what{font-size:14px;color:var(--green)}
.st.miss .what{color:var(--mute)}
.st .arr{margin-inline-start:auto;color:var(--mute);font-size:20px}
.back{border:0;background:none;color:var(--green);font:inherit;font-size:16px;font-weight:600;padding:6px 0;cursor:pointer;margin-bottom:6px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:700}
.b-g{background:var(--green2);color:var(--green)}.b-a{background:var(--amber2);color:var(--amber)}.b-r{background:var(--red2);color:var(--red)}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stat .n{font-size:22px;font-weight:800}.stat .l{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:8px}
.grid i{aspect-ratio:1;border-radius:4px;background:var(--dot)}
.grid i.on{background:var(--green)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.stp{display:flex;align-items:center;gap:10px;padding:6px 0}
.stp .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--dot);color:var(--mute);font-weight:700;flex:none}
.stp.done .dot{background:var(--green);color:#fff}
.stp.cur .dot{background:var(--amber2);color:var(--amber);border:2px solid var(--amber)}
.stp.cur{font-weight:700}.stp.todo{color:var(--mute)}
.stp.rej .dot{background:var(--red2);color:var(--red)}
.note.info{background:var(--bg);border:1px solid var(--line)}.note.info b{color:var(--ink)}
.b-n{background:var(--dot);color:var(--mute)}
#who{margin-top:8px;font-weight:600}
.topbar{position:sticky;top:0;z-index:20;background:#1f6b4f;color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 10px;min-height:58px}
.topbar .r{display:flex;align-items:center;gap:8px;min-width:0}
#menubtn{background:none;border:0;color:#fff;font-size:28px;line-height:1;padding:4px 8px;cursor:pointer;position:relative}
#hname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl{font-size:22px;font-weight:800;letter-spacing:.5px}
#bell{background:none;border:0;line-height:0;padding:6px 8px;cursor:pointer;position:relative}
.bellb{position:absolute;top:-2px;right:0;min-width:18px;height:18px;border-radius:9px;background:#ff6b5e;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;padding:0 4px}
.nt{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--bg);color:var(--ink);border:2px solid #1f6b4f;border-radius:14px;padding:12px 14px;margin-bottom:10px;text-align:right;font:inherit;font-size:16px;cursor:default}
button.nt{cursor:pointer;align-items:center}
.nt .ntic{color:var(--green);flex:none}
.nt .d{color:var(--mute)}
.pch{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;margin:3px;font:inherit;font-size:14px;cursor:pointer}
.pch.on{border-color:var(--green);background:var(--green2);color:var(--green);font-weight:700}
span.pch{cursor:default;border-color:var(--green);background:var(--green2);color:var(--green);padding:5px 11px;font-size:13px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 14px 22px;z-index:46;box-shadow:0 -6px 24px rgba(0,0,0,.3);animation:up .22s ease-out}
.sheet .card{margin-bottom:0;border:0;box-shadow:none;padding:4px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.dotb{position:absolute;top:3px;left:5px;width:10px;height:10px;background:#ff6b5e;border-radius:50%}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(82vw,310px);background:var(--card);z-index:40;transform:translateX(105%);transition:transform .22s;overflow:auto;padding-bottom:24px;box-shadow:-4px 0 24px rgba(0,0,0,.25)}
.drawer.on{transform:none}
.dh{background:#1f6b4f;color:#fff;padding:24px 16px 18px;margin-bottom:6px}
.dh .s{font-size:14px;opacity:.85}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;text-align:right;cursor:pointer}
.mi.on{background:var(--green2);color:var(--green);font-weight:700}
.mi .bd{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:99px;font-size:13px;padding:0 8px;min-width:22px;text-align:center}
.msep{height:1px;background:var(--line);margin:8px 16px}
.dbox{margin:18px 16px 0;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--mute)}
.st.pend .no{background:var(--amber2);color:var(--amber)}.st.pend .what{color:var(--amber)}
.stat.sm{padding:10px 6px;display:flex;flex-direction:column;gap:3px}
.stat.sm .l{font-size:12px;color:var(--mute)}
.stat.sm .n{font-size:14px;line-height:1.5;font-weight:700}
.stat.sm .sb{font-size:11.5px;color:var(--mute);line-height:1.4}
.chip{border:1px solid var(--green);background:var(--green2);color:var(--green);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.phone{width:46px;height:46px;border-radius:50%;background:#1f6b4f;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:21px;flex:none}
.fab{position:fixed;left:18px;bottom:22px;width:58px;height:58px;border-radius:50%;background:#1f6b4f;color:#fff;font-size:32px;line-height:1;border:0;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:15;cursor:pointer}
.cnt{display:inline-block;background:#1f6b4f;color:#fff;border-radius:99px;font-size:12px;min-width:20px;padding:0 6px;text-align:center;line-height:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.demo{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
</style>
</head>
<body>
<header class="topbar"><div class="r"><button id="menubtn" aria-label="القائمة">☰</button><span id="hname"></span></div><div class="ttl">ارتقاء</div><div style="display:flex;justify-content:flex-end"><button id="bell" aria-label="التنبيهات"><svg width="26" height="26" viewBox="0 0 24 24" fill="#1f6b4f" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button></div></header>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer"></nav>
<div class="wrap">
  <div id="view"></div>
  <div class="demo">نموذج تجريبي: البيانات وهمية وتضيع عند إعادة التحميل</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SURAHS=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const JUZ=["البقرة (٣)", "البقرة (٢)", "البقرة (١)", "ال عمران (٢)", "ال عمران (١)", "النساء", "المائدة", "الأنعام (٢)", "الأنعام (١)", "الأعراف", "التوبة", "يونس", "يوسف", "الحجر", "الإسراء", "مريم", "الأنبياء", "المؤمنون", "الفرقان", "النمل", "الروم", "الأحزاب", "يس", "الزمر", "الشورى", "الأحقاف", "الذاريات", "المجادلة", "تبارك", "عم"];
const DAY=864e5;
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const juzName=n=>"جزء "+JUZ[n-1];
const rangeTitle=r=>r.mode==="seg"?segLabel(r.g):r.mode==="ayah"?"سورة "+SURAHS[r.surah-1]+"، "+(r.from===r.to?"آية "+ar(r.from):"من آية "+ar(r.from)+" إلى آية "+ar(r.to)):r.mode==="juz"
  ?(r.from===r.to?juzName(r.from):"من "+juzName(r.from)+" إلى "+juzName(r.to))
  :(r.from===r.to?"سورة "+SURAHS[r.from-1]:"من "+SURAHS[r.from-1]+" إلى "+SURAHS[r.to-1]);
const dayDate=d=>new Date(Date.now()-d*DAY);
const dayLabel=d=>d===0?"اليوم":d===1?"أمس":dayDate(d).toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{weekday:"long",day:"numeric",month:"long"});
const hijri=d=>dayDate(d).toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"});
const gregShort=d=>dayDate(d).toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long"});
const dayFull=d=>dayDate(d).toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{weekday:"long",day:"numeric",month:"long"});

/* بيانات تجريبية */
const STUDENTS=[
 {id:1,name:"محمد",mode:"juz",rate:.9},{id:2,name:"أحمد",mode:"juz",rate:.8},{id:3,name:"عبدالرحمن",mode:"juz",rate:.5},
 {id:4,name:"يوسف",mode:"juz",rate:.2},{id:5,name:"خالد",mode:"juz",rate:.7},{id:6,name:"سلمان",mode:"surah",rate:.85},
 {id:7,name:"فهد",mode:"surah",rate:.4},{id:8,name:"عمر",mode:"surah",rate:.1}];
let rid=0;const REVIEWS=[];
const h=(a,b)=>((a*2654435761+b*40503)>>>0)%100;
STUDENTS.forEach(s=>{for(let d=0;d<30;d++){
  if(h(s.id,d)<s.rate*100){
    if(s.mode==="juz"){const f=1+h(s.id,d+50)%30;const multi=h(s.id,d+9)<25;const t=multi?Math.min(30,f+1+h(s.id,d+3)%2):f;REVIEWS.push({id:++rid,sid:s.id,d,mode:"juz",from:t,to:f})}
    else{const f=78+h(s.id,d+50)%36;const multi=h(s.id,d+9)<35;const t=multi?Math.min(114,f+1+h(s.id,d+3)%3):f;REVIEWS.push({id:++rid,sid:s.id,d,mode:"surah",from:f,to:t})}
  }}});

const AY=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const PROG={1:{s:2,a:120},2:{s:4,a:45},3:{s:18,a:60},4:{s:36,a:20},5:{s:67,a:10},6:{s:78,a:15},7:{s:93,a:5},8:{s:105,a:3}};
STUDENTS.forEach(s=>{s.phone="050000000"+s.id;s.p=PROG[s.id]});
const HEARD=[];
STUDENTS.forEach(s=>{for(let k=0;k<3;k++){const d=2+k*7+h(s.id,k)%4;const sn=1+h(s.id,d+70)%114,a=1+h(s.id,d+71)%AY[sn-1],b=Math.min(AY[sn-1],a+2+h(s.id,d+72)%10);HEARD.push({id:++rid,sid:s.id,d,mode:"ayah",surah:sn,from:a,to:b})}});
const NOTES=["ما شاء الله، تلاوة متقنة.","أخطأ في موضعين، يحتاج إعادة مراجعة.","جيد، انتبه للمدود.","ممتاز، استمر على هذا المستوى."];
HEARD.forEach((r,i)=>{if(i%3!==1){r.note=NOTES[i%4];r.nt=["good","warn","warn","good"][i%4]}});

  if(e.target.id==="canceledit"||e.target.closest("[data-sheetclose]")){state.editId=null;state.sheet=false;state.dsheet=null;state.rejId=null;state.err="";render(true);return}
  const rd1=e.target.closest("[data-rdel]");if(rd1){state.delId=+rd1.dataset.rdel;render(true);return}
  if(e.target.closest("[data-delno]")){state.delId=null;render(true);return}
  const rd2=e.target.closest("[data-delyes]");
  if(rd2){const id=+rd2.dataset.delyes,i=REVIEWS.findIndex(x=>x.id===id);if(i>=0)REVIEWS.splice(i,1);if(state.editId===id)state.editId=null;state.delId=null;render(true);toast("تم الحذف");return}
  const hd1=e.target.closest("[data-hdel]");if(hd1){state.delHid=+hd1.dataset.hdel;render(true);return}
  if(e.target.closest("[data-hdelno]")){state.delHid=null;render(true);return}
  const hd2=e.target.closest("[data-hdelyes]");
  if(hd2){const id=+hd2.dataset.hdelyes,i=HEARD.findIndex(x=>x.id===id);if(i>=0)HEARD.splice(i,1);state.delHid=null;render(true);toast("تم حذف التسميع");return}
  if(e.target.id==="reqexam"){const me=stu(state.me);if(me.sg>=segN(me)&&!activeReq(me.id)&&me.jd<30){REQS.push({id:++reqId,sid:me.id,juz:curJuz(me),stage:"new",at:Date.now()});render();toast("تم إرسال طلبك ✓")}return}
  const as=e.target.closest("[data-assign]");
  if(as){const r=REQS.find(x=>x.id===+as.dataset.assign),sel=document.getElementById("as-"+r.id),v=sel&&sel.value;if(!v)return;
    if(r.stage==="new"){r.stage="sard";r.sard={by:v}}else if(r.stage==="sard_done"){r.stage="exam";r.exam={by:v}}
    render(true);toast("تم التوجيه إلى "+shName(v)+" ✓");return}
  const un=e.target.closest("[data-unassign]");
  if(un){const r=REQS.find(x=>x.id===+un.dataset.unassign);if(r.stage==="sard"){r.stage="new";delete r.sard}else if(r.stage==="exam"){r.stage="sard_done";delete r.exam}render(true);return}
  const ap=e.target.closest("[data-approve],[data-reject]");
  if(ap){const ok=ap.hasAttribute("data-approve"),id=+(ap.dataset.approve||ap.dataset.reject),r=REQS.find(x=>x.id===id),ta=document.getElementById("mn-"+id);
    r.res={ok,note:ta?ta.value.trim():"",at:Date.now()};r.stage=ok?"approved":"rejected";
    if(ok){const x=stu(r.sid);x.jd=Math.min(30,x.jd+1);x.sg=0;state.rd.si=undefined}
    render(true);toast(ok?"تم الاعتماد وتحديث أجزاء الطالب ✓":"تم إرسال النتيجة للطالب");return}
  const sd=e.target.closest("[data-sarddone]");
  if(sd){const r=REQS.find(x=>x.id===+sd.dataset.sarddone),ta=document.getElementById("sn-"+r.id);r.sard.note=ta?ta.value.trim():"";r.sard.at=Date.now();r.stage="sard_done";render(true);toast("تم السرد وأُرسل للمشرف ✓");return}
  const ed=e.target.closest("[data-examdone]");
  if(ed){const r=REQS.find(x=>x.id===+ed.dataset.examdone),g=document.getElementById("eg-"+r.id),n=document.getElementById("en-"+r.id);
    const gv=g&&g.value!==""?+g.value:NaN;if(!(gv>=0&&gv<=100)){toast("أدخل الدرجة من ٠ إلى ١٠٠");return}
    r.exam.grade=gv;r.exam.note=n?n.value.trim():"";r.exam.at=Date.now();r.stage="exam_done";render(true);toast("أُرسلت النتيجة للمشرف ✓");return}
  const av=e.target.closest("[data-avail]");
  if(av){const me=SH.find(y=>y.id==={sard:"s1",exam:"e1",ribt:"r1"}[state.view]);me.avail=av.dataset.avail==="1";render(true);return}
  const sj=e.target.closest("[data-sgadj]");
  if(sj){const x=stu(state.open);x.sg=Math.max(0,Math.min(segN(x),x.sg+ +sj.dataset.sgadj));render(true);return}
  if(e.target.id==="reqribt"){const me=stu(state.me);
    if(me.sg>=1&&!RB.find(r=>r.sid===me.id&&r.stage!=="done")&&!RB.find(r=>r.sid===me.id&&r.stage==="done"&&wkOf(r.dd)===0)){RB.push({id:++rbId,sid:me.id,d:0,stage:"new",juz:curJuz(me),segs:me.sg});render();toast("تم إرسال طلب الربط ✓")}return}
  const rA=e.target.closest("[data-rassign]");
  if(rA){const r=RB.find(x=>x.id===+rA.dataset.rassign),sel=document.getElementById("ra-"+r.id),v=sel&&sel.value;if(!v)return;r.stage="ribt";r.by=v;render(true);toast("تم التوجيه إلى "+shName(v)+" ✓");return}
  const rU=e.target.closest("[data-runassign]");
  if(rU){const r=RB.find(x=>x.id===+rU.dataset.runassign);r.stage="new";delete r.by;render(true);return}
  const rD=e.target.closest("[data-ribtdone]");
  if(rD){const r=RB.find(x=>x.id===+rD.dataset.ribtdone),ta=document.getElementById("rbn-"+r.id);r.note=ta?ta.value.trim():"";r.stage="done";r.dd=0;render(true);toast("تم الربط وأُبلغ المشرف ✓");return}
  const rW=e.target.closest("[data-wk]");
  if(rW&&!rW.disabled){state.wk=Math.max(0,Math.min(8,state.wk+ +rW.dataset.wk));render(true);return}
  const ch=e.target.closest("[data-chat]");if(ch){openConv(getConv(+ch.dataset.chat,"b").id);render();return}
  if(e.target.closest("[data-cback]")){state.conv=null;render();return}
  const oc=e.target.closest("[data-openconv]");if(oc){openConv(+oc.dataset.openconv);render();return}
  if(e.target.closest("[data-newchat]")){state.newchat=true;render();return}
  if(e.target.closest("[data-ncback]")){state.newchat=false;render();return}
  const nc=e.target.closest("[data-newconv]");
  if(nc){const [sid,hid]=nc.dataset.newconv.split(":");state.newchat=false;openConv(getConv(+sid,hid).id);render();return}
  const qs=e.target.closest("[data-qsend]");if(qs){sendMsg(qs.dataset.qsend);return}
  if(e.target.id==="csend"){const ta=document.getElementById("cmsg"),t=ta?ta.value.trim():"";if(t)sendMsg(t);return}
  const mo=e.target.closest("[data-more]");if(mo){state.lim[mo.dataset.more]+=5;render(true);return}
  const ls=e.target.closest("[data-less]");if(ls){state.lim[ls.dataset.less]=3;render(true);return}
  const ok1=e.target.closest("[data-rok]");if(ok1){const r=REVIEWS.find(x=>x.id===+ok1.dataset.rok);if(r){r.st="ok";r.rn=""}render(true);toast("تم القبول ✓");return}
  const rj1=e.target.closest("[data-rrej]");if(rj1){state.rejId=+rj1.dataset.rrej;render(true);return}
  if(e.target.closest("[data-rrejno]")){state.rejId=null;render(true);return}
  const rj2=e.target.closest("[data-rrejgo]");if(rj2){const id=+rj2.dataset.rrejgo,r=REVIEWS.find(x=>x.id===id),el=document.getElementById("rj-"+id);if(r){NOTIF.push({id:++nid,sid:r.sid,t:rangeTitle(r),d:r.d,rn:el?el.value.trim():""});const i=REVIEWS.indexOf(r);if(i>=0)REVIEWS.splice(i,1)}state.rejId=null;render(true);toast("تم الرفض وحُذفت المراجعة");return}
  const pl=e.target.closest("[data-plan]");if(pl){const id=+pl.dataset.plan,pp=PLANS[id];state.pe=id;state.pd=pp?{juz:pp.juz,surah:pp.surah,note:pp.note||"",err:""}:{juz:1,surah:0,note:"",err:""};render();return}
  if(e.target.closest("[data-pback]")){state.pe=null;render();return}
  const ps=e.target.closest("[data-pstep]");if(ps){const d=state.pd,k=ps.dataset.pstep;d[k]=Math.max(0,Math.min(k==="juz"?30:20,d[k]+ +ps.dataset.pdelta));d.err="";render(true);return}
  if(e.target.id==="psave"){const d=state.pd;
    if(d.juz+d.surah<1){d.err="حدد جزءاً أو سورة على الأقل.";render(true);return}
    const sid=state.pe;PLANS[sid]={juz:d.juz,surah:d.surah,note:d.note.trim(),at:0};
    NOTIF.push({id:++nid,sid,kind:"plan"});state.pe=null;state.pd=null;render();toast("تم حفظ الخطة ✓");return}
  const pg=e.target.closest("[data-pgo]");if(pg){const i=NOTIF.findIndex(x=>x.id===+pg.dataset.pgo);if(i>=0)NOTIF.splice(i,1);state.notifs=false;state.stab="plan";render();return}
  const nd=e.target.closest("[data-ndis]");if(nd){const i=NOTIF.findIndex(x=>x.id===+nd.dataset.ndis);if(i>=0)NOTIF.splice(i,1);render(true);return}
  if(e.target.id==="approve"){state.apc=true;render(true);return}
  if(e.target.id==="apno"){state.apc=false;render(true);return}
  if(e.target.id==="apyes"){const d=state.day;REVIEWS.forEach(r=>{if(r.d===d&&r.st!=="rej")r.st="ok"});APD.add(d);state.apc=false;state.day=openDay();render();toast("تم اعتماد القائمة ✓");return}
  const dn=e.target.closest("[data-day]");
  if(dn&&!dn.disabled){state.day=Math.max(openDay(),Math.min(29,state.day+ +dn.dataset.day));state.apc=false;state.dsheet=null;render();return}
  const ds=e.target.closest("[data-dsheet]");if(ds){state.dsheet=+ds.dataset.dsheet;state.rejId=null;render(true);return}
  const op=e.target.closest("[data-open]");
  if(op){state.dsheet=null;state.rejId=null;state.open=+op.dataset.open;state.lim={heard:3,rev:3,ribt:3};state.conv=null;state.newchat=false;render();return}
  if(e.target.closest("[data-back]")){state.open=null;render();return}
  if(e.target.id==="copy"){
    try{navigator.clipboard.writeText(listText()).then(()=>toast("تم النسخ ✓"),()=>toast("تعذّر النسخ"))}catch(_){toast("تعذّر النسخ")}
  }
});
document.addEventListener("change",e=>{
  const d=state.draft;
  if(e.target.id==="from"){d.from=+e.target.value;if(!d.multi||(d.mode==="juz"?d.to>d.from:d.to<d.from))d.to=d.from;render()}
  if(e.target.id==="to"){d.to=+e.target.value}
  if(e.target.id==="who"){state.pe=null;state.dsheet=null;state.notifs=false;state.sheet=false;state.editId=null;state.view=e.target.value;state.stab="home";state.tab="daily";state.rp="home";state.wk=0;state.lim={heard:3,rev:3,ribt:3};state.open=null;state.conv=null;state.newchat=false;state.hear=null;state.err="";menu(false);render();return}
  if(e.target.classList&&e.target.classList.contains("ntsel"))e.target.dataset.v=e.target.value;
  if(e.target.id==="rseg"){state.rd.si=+e.target.value}
  if(e.target.id==="rs"){const rd=state.rd;rd.s=+e.target.value;rd.from=1;rd.to=Math.min(10,AY[rd.s-1]);rd.err="";render()}
  if(e.target.id==="rfrom"||e.target.id==="rto")syncRd();
  const hr=state.hear;
  if(hr&&e.target.id==="hfrom"){syncHear();if(!hr.multi||hr.to<hr.from)hr.to=hr.from;render()}
  if(hr&&e.target.id==="hps"){syncHear();hr.pa=Math.min(hr.pa,AY[hr.ps-1]);render()}
});
document.addEventListener("input",e=>{
  if(state.pd&&e.target.id==="pnote")state.pd.note=e.target.value;
  if(e.target.id==="q"){const q=e.target.value.trim();document.querySelectorAll(".st[data-name]").forEach(b=>{b.style.display=!q||b.dataset.name.includes(q)?"":"none"})}
});
render();
</script>
</body>
</html>
